name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore packages
        run: dotnet restore Xdiff.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format Xdiff.slnx --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build Xdiff.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test coverage checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Run tests with coverage
        id: tests
        run: |
          dotnet test --solution Xdiff.slnx -c Release --no-build \
            --results-directory ./artifacts/coverage -- \
            --coverlet --coverlet-output-format cobertura \
            --coverlet-include '[Xdiff]*' \
            --report-xunit-trx

      - name: Enforce coverage thresholds
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python3 .github/scripts/check_coverage.py artifacts/coverage

      - name: Generate HTML coverage report
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/*.cobertura.*.xml') != '' }}
        run: |
          dotnet tool restore
          dotnet reportgenerator \
            '-reports:./artifacts/coverage/*.cobertura.*.xml' \
            '-targetdir:./artifacts/coverage/report' \
            '-assemblyfilters:+Xdiff' \
            -reporttypes:Html

      - name: Upload coverage and test results
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/**') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-and-test-results
          path: artifacts/coverage/
          retention-days: 14
          if-no-files-found: error
